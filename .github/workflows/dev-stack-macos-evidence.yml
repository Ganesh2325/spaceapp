# Evidence run for a real macOS dev-stack transcript. GitHub's arm64 macOS
# runners cannot nest a Linux VM. macos-15-intel can. This file is not the
# product CI job; drop it from an upstream pull request.
name: Dev stack macOS evidence

on:
  push:
    branches:
      - cursor/dev-stack-from-source-6389
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-stack-macos-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Dev stack on macOS
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Colima and the Docker CLI
        run: |
          set -euxo pipefail
          export HOMEBREW_NO_ENV_HINTS=1
          brew install colima docker docker-compose
          mkdir -p "$HOME/.docker/cli-plugins"
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string || true

      - name: Start Colima
        run: |
          set -euxo pipefail
          colima start --runtime docker --cpu 3 --memory 6 --disk 30
          docker context show
          docker info
          docker compose version

      - name: Install dependencies
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci

      - name: Probe how published ports reach the Mac
        run: |
          set +e
          probe() {
            local publish="$1"
            local name="$2"
            docker rm -f "$name" >/dev/null 2>&1
            docker run -d --name "$name" -p "$publish" public.ecr.aws/docker/library/nginx:1.27-alpine
            local started=$?
            if [ "$started" -ne 0 ]; then
              echo "PROBE $name: container did not start"
              return 1
            fi
            sleep 3
            curl -fsS --max-time 5 http://127.0.0.1:18080/ >/dev/null
          }
          if probe "127.0.0.1:18080:80" loopback-probe; then
            echo "PROBE loopback-publish: reachable on 127.0.0.1"
          else
            echo "PROBE loopback-publish: not reachable on 127.0.0.1"
            docker logs loopback-probe || true
          fi
          docker rm -f loopback-probe >/dev/null 2>&1
          if probe "18080:80" guest-probe; then
            echo "PROBE guest-publish: reachable on 127.0.0.1"
          else
            echo "PROBE guest-publish: not reachable on 127.0.0.1"
            docker logs guest-probe || true
          fi
          docker rm -f guest-probe >/dev/null 2>&1
          docker context show
          exit 0

      - name: Run the dev stack and reset it
        run: |
          set -o pipefail
          {
            echo "===== node-pty spawn-helper before dev-stack ====="
            ls -l node_modules/node-pty/prebuilds/darwin-x64/spawn-helper node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper node_modules/node-pty/build/Release/spawn-helper || true
            echo "===== host ====="
            uname -a
            sw_vers
            echo "===== gate ====="
            node scripts/ci-dev-stack-gate.mjs
          } 2>&1 | tee "$RUNNER_TEMP/macos-dev-stack-transcript.txt"

      - name: Upload the macOS transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dev-stack-transcript
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/macos-dev-stack-transcript.txt
            /tmp/spaceapp-dev-stack-supervisor.log
            /tmp/spaceapp-dev-stack-linux-transcript.txt
            /tmp/spaceapp-dev-stack-logs

      - name: Stop Colima
        if: always()
        run: colima delete -f || true
